{% extends "base.html" %}

{% block title %}Page not found | {{ SITENAME }}{% endblock %}

{% block content %}
  <script>
    // GitHub Pages serves this page for unknown paths. Slide decks are single-page
    // apps, so send deep links like /slides/1/7 back to the deck, which restores
    // the route (see copy_slides in tools/build.py).
    (function () {
      var match = window.location.pathname.match(/^(\/slides\/[^/]+\/)(.+)$/);
      if (match) {
        var search = window.location.search.replace(/^\?/, "&");
        window.location.replace(match[1] + "?route=" + encodeURIComponent(match[2]) + search + window.location.hash);
      }
    })();
  </script>
  <header class="page-hero">
    <div class="shell">
      <p class="section-kicker">404</p>
      <h1>Page not found.</h1>
      <p>This page does not exist or has moved.</p>
    </div>
  </header>

  <section class="section">
    <div class="shell prose">
      <div class="actions">
        <a class="button dark" href="{{ SITEURL }}/">Back to the homepage</a>
        <a class="button light" href="{{ SITEURL }}/events/">All events</a>
      </div>
    </div>
  </section>
{% endblock %}
