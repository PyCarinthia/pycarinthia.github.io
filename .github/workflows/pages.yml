name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pelican site
    runs-on: ubuntu-latest
    env:
      PYCARINTHIA_EVENTS_API: ${{ vars.PYCARINTHIA_EVENTS_API }}
      PYCARINTHIA_RESOURCES_API: ${{ vars.PYCARINTHIA_RESOURCES_API }}
      PYCARINTHIA_CONTACT_EMAIL: ${{ vars.PYCARINTHIA_CONTACT_EMAIL }}
      PYCARINTHIA_CONTACT_FORM_URL: ${{ vars.PYCARINTHIA_CONTACT_FORM_URL }}
      PYCARINTHIA_PROPOSAL_FORM_URL: ${{ vars.PYCARINTHIA_PROPOSAL_FORM_URL }}
      PYCARINTHIA_RSVP_PLATFORM_URL: ${{ vars.PYCARINTHIA_RSVP_PLATFORM_URL }}
      SITEURL: ${{ vars.SITEURL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build static site
        run: python tools/build.py --settings publishconf.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
